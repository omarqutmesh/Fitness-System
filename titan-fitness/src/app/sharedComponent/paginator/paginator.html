<div class="paginator">
  <small class="text-muted">Showing {{ from() }} to {{ to() }} of {{ total() }} entries</small>
  <div class="page-buttons">
    <button type="button" class="page-btn" [disabled]="page() === 1" (click)="go(page() - 1)">
      <i class="bi bi-chevron-left"></i>
    </button>
    @for (p of pages(); track p) {
      <button type="button" class="page-btn" [class.active]="p === page()" (click)="go(p)">
        {{ p }}
      </button>
    }
    <button
      type="button"
      class="page-btn"
      [disabled]="page() === pages().length"
      (click)="go(page() + 1)"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
